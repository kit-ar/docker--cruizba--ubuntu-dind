name: Build and push Docker image to GHCR

# kit-ar fork workflow (upstream's build-and-push-docker-image.yml only runs in
# cruizba/ubuntu-dind). Pull requests build and test; releases and manual runs
# also push to GHCR.
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Docker version for the tags is read from the Dockerfile, so upstream
  # version bumps flow through. Reset BUILD_NUMBER to 0 when it changes.
  BUILD_NUMBER: "0"
  LATEST_UBUNTU_VERSION: "24.04"
  IMAGE: ghcr.io/${{ github.repository_owner }}/cruizba--ubuntu-dind

jobs:
  # Each architecture is built and tested natively (amd64 on ubuntu-24.04,
  # arm64 on ubuntu-24.04-arm) and pushed by digest; no QEMU. The merge job
  # stitches the per-arch digests into multi-arch manifests.
  build:
    name: build (${{ matrix.ubuntu_version }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        ubuntu_version: ["22.04", "24.04", "26.04"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          tags: ${{ env.IMAGE }}:${{ matrix.ubuntu_version }}-test

      - name: Test Docker-in-Docker (privileged mode)
        run: |
          chmod +x test.sh
          ./test.sh --mode privileged --use-systemd false --image-name "$IMAGE:${{ matrix.ubuntu_version }}-test"

      - name: Test kit-ar tools
        run: kit/test-tools.sh "$IMAGE:${{ matrix.ubuntu_version }}-test"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu_version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.ubuntu_version }}-${{ matrix.arch }}
          path: /tmp/digests/
          if-no-files-found: error
          retention-days: 1

  # Runs only if every architecture built and passed its tests.
  merge:
    name: merge (${{ matrix.ubuntu_version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        ubuntu_version: ["22.04", "24.04", "26.04"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Docker version from Dockerfile
        run: |
          version="$(sed -n 's/^ *DOCKER_VERSION=\([0-9.]*\).*/\1/p' Dockerfile)"
          test -n "$version"
          echo "CURRENT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.ubuntu_version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        working-directory: /tmp/digests
        run: |
          v="${{ matrix.ubuntu_version }}"
          tags=(-t "$IMAGE:$v"
                -t "$IMAGE:$v-${CURRENT_VERSION}"
                -t "$IMAGE:$v-${CURRENT_VERSION}-r${BUILD_NUMBER}")
          if [ "$v" = "$LATEST_UBUNTU_VERSION" ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$IMAGE:${{ matrix.ubuntu_version }}-${CURRENT_VERSION}"
